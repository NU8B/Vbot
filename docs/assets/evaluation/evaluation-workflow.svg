<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="600" viewBox="0 0 1180 600" role="img" aria-labelledby="title desc">
  <title id="title">Vbot evaluation workflow</title>
  <desc id="desc">Diagram showing Vbot evaluation layers from data gates through human TTS comparison, benchmarks, CI checks, and release smoke validation.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#67e8f9"/>
    </marker>
    <style>
      .bg { fill: #0a0f1f; }
      .title { font-family: Inter, Segoe UI, Arial, sans-serif; fill: #f8fafc; font-size: 24px; font-weight: 700; }
      .sub { font-family: Inter, Segoe UI, Arial, sans-serif; fill: #cbd5e1; font-size: 15px; }
      .node { fill: #111827; stroke: #475569; stroke-width: 1.2; rx: 12; }
      .human { fill: #102820; stroke: #34d399; stroke-width: 1.4; rx: 12; }
      .manual { fill: #2b2114; stroke: #fbbf24; stroke-width: 1.4; rx: 12; }
      .ci { fill: #1e1b4b; stroke: #818cf8; stroke-width: 1.4; rx: 12; }
      .txt { font-family: Inter, Segoe UI, Arial, sans-serif; fill: #e5e7eb; font-size: 15px; font-weight: 700; }
      .small { font-family: Inter, Segoe UI, Arial, sans-serif; fill: #cbd5e1; font-size: 12px; }
      .line { fill: none; stroke: #67e8f9; stroke-width: 2; marker-end: url(#arrow); }
    </style>
  </defs>
  <rect class="bg" width="1180" height="600"/>
  <text class="title" x="48" y="52">Evaluation Workflow</text>
  <text class="sub" x="48" y="78">Vbot evaluates data before training, generated speech after training, source contracts in CI, and packaged app behavior before release.</text>

  <rect class="node" x="70" y="134" width="180" height="92"/>
  <text class="txt" x="104" y="170">Data gates</text>
  <text class="small" x="100" y="196">duration, VAD, STOI, PESQ</text>

  <rect class="human" x="310" y="134" width="180" height="92"/>
  <text class="txt" x="342" y="170">Segment review</text>
  <text class="small" x="344" y="196">human approve/edit/reject</text>

  <rect class="node" x="550" y="134" width="180" height="92"/>
  <text class="txt" x="584" y="170">Sample generation</text>
  <text class="small" x="584" y="196">emotion prompts per model</text>

  <rect class="human" x="790" y="100" width="220" height="92"/>
  <text class="txt" x="830" y="136">Human TTS eval</text>
  <text class="small" x="830" y="162">emotion recognition</text>

  <rect class="manual" x="790" y="228" width="220" height="92"/>
  <text class="txt" x="822" y="264">Archived metrics</text>
  <text class="small" x="822" y="290">speaker, PESQ, STOI, MCD</text>

  <rect class="ci" x="310" y="386" width="220" height="94"/>
  <text class="txt" x="358" y="422">CI contract checks</text>
  <text class="small" x="350" y="448">imports, prompts, data logic</text>

  <rect class="manual" x="610" y="386" width="220" height="94"/>
  <text class="txt" x="652" y="422">Release smoke</text>
  <text class="small" x="650" y="448">manual Windows package check</text>

  <line class="line" x1="250" y1="180" x2="310" y2="180"/>
  <line class="line" x1="490" y1="180" x2="550" y2="180"/>
  <line class="line" x1="730" y1="166" x2="790" y2="146"/>
  <line class="line" x1="730" y1="198" x2="790" y2="274"/>
  <path class="line" d="M 400 226 C 400 306 420 338 420 386"/>
  <line class="line" x1="530" y1="433" x2="610" y2="433"/>

  <rect class="node" x="910" y="386" width="180" height="94"/>
  <text class="txt" x="954" y="422">Decision</text>
  <text class="small" x="944" y="448">ship, retrain, or revise</text>
  <line class="line" x1="830" y1="433" x2="910" y2="433"/>
  <path class="line" d="M 900 320 C 970 350 995 370 1000 386"/>
</svg>
