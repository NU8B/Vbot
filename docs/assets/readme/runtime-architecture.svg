<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="650" viewBox="0 0 1280 650" role="img" aria-labelledby="title desc">
  <title id="title">Vbot runtime architecture</title>
  <desc id="desc">A clear left-to-right runtime flow: user input and speech transcription feed the shared LLM, whose cleaned response is classified for speech, playback, avatar animation, and the desktop UI.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#7dd3fc"/>
    </marker>
    <style>
      .bg { fill: #0b1020; }
      .title { font-family: Inter, Segoe UI, Arial, sans-serif; fill: #f8fafc; font-size: 24px; font-weight: 700; }
      .sub { font-family: Inter, Segoe UI, Arial, sans-serif; fill: #cbd5e1; font-size: 15px; }
      .node { fill: #111827; stroke: #475569; stroke-width: 1.2; rx: 12; }
      .llm { fill: #251a35; stroke: #c084fc; stroke-width: 1.4; rx: 12; }
      .voice { fill: #102820; stroke: #34d399; stroke-width: 1.4; rx: 12; }
      .avatar { fill: #2b2114; stroke: #fbbf24; stroke-width: 1.4; rx: 12; }
      .txt { font-family: Inter, Segoe UI, Arial, sans-serif; fill: #e5e7eb; font-size: 15px; font-weight: 700; }
      .small { font-family: Inter, Segoe UI, Arial, sans-serif; fill: #cbd5e1; font-size: 12px; }
      .label { font-family: Inter, Segoe UI, Arial, sans-serif; fill: #bae6fd; font-size: 12px; font-weight: 600; }
      .line { fill: none; stroke: #7dd3fc; stroke-width: 2; marker-end: url(#arrow); }
    </style>
  </defs>
  <rect class="bg" width="1280" height="650"/>
  <text class="title" x="48" y="52">Vbot Runtime Architecture</text>
  <text class="sub" x="48" y="78">A modular desktop pipeline: a shared LLM produces a response that drives voice, playback, avatar animation, and the UI.</text>

  <!-- Input and LLM path -->
  <rect class="node" x="50" y="270" width="160" height="82"/>
  <text class="txt" x="88" y="304">User input</text>
  <text class="small" x="88" y="328">text or speech</text>

  <rect class="node" x="270" y="118" width="180" height="82"/>
  <text class="txt" x="302" y="152">Faster-Whisper</text>
  <text class="small" x="320" y="176">speech to text</text>

  <rect class="llm" x="270" y="270" width="180" height="82"/>
  <text class="txt" x="308" y="304">OllamaHandler</text>
  <text class="small" x="300" y="326">prompt + history</text>
  <text class="small" x="324" y="344">window</text>

  <rect class="llm" x="500" y="270" width="180" height="82"/>
  <text class="txt" x="540" y="304">Shared Ollama</text>
  <text class="small" x="536" y="328">Dockerized LLM</text>

  <rect class="node" x="730" y="270" width="150" height="82"/>
  <text class="txt" x="768" y="304">Cleanup</text>
  <text class="small" x="752" y="328">remove action text</text>

  <rect class="voice" x="930" y="270" width="150" height="82"/>
  <text class="txt" x="966" y="304">Emotion</text>
  <text class="small" x="950" y="328">RoBERTa GoEmotions</text>

  <rect class="voice" x="1120" y="270" width="140" height="82"/>
  <text class="txt" x="1144" y="304">StyleTTS2</text>
  <text class="small" x="1134" y="328">voice + cache</text>

  <line class="line" x1="210" y1="311" x2="270" y2="311"/>
  <path class="line" d="M 210 286 L 270 159"/>
  <path class="line" d="M 360 200 L 360 270"/>
  <line class="line" x1="450" y1="311" x2="500" y2="311"/>
  <line class="line" x1="680" y1="311" x2="730" y2="311"/>
  <line class="line" x1="880" y1="311" x2="930" y2="311"/>
  <line class="line" x1="1080" y1="311" x2="1120" y2="311"/>

  <!-- Voice and visual output path. The arrows are deliberately routed on separate lanes. -->
  <rect class="avatar" x="720" y="474" width="180" height="92"/>
  <text class="txt" x="762" y="508">THA4 avatar</text>
  <text class="small" x="748" y="534">emotion + speaking</text>

  <rect class="node" x="1010" y="474" width="180" height="92"/>
  <text class="txt" x="1060" y="508">Audio</text>
  <text class="small" x="1038" y="534">non-blocking playback</text>

  <rect class="node" x="430" y="474" width="210" height="92"/>
  <text class="txt" x="482" y="508">Desktop UI</text>
  <text class="small" x="472" y="534">chat + avatar panel</text>

  <path class="line" d="M 1190 352 L 1100 474"/>
  <text class="label" x="1142" y="414">synthesize</text>
  <path class="line" d="M 1005 352 L 810 474"/>
  <text class="label" x="892" y="414">expression</text>
  <line class="line" x1="1010" y1="520" x2="900" y2="520"/>
  <text class="label" x="920" y="506">speaking state</text>
  <line class="line" x1="720" y1="520" x2="640" y2="520"/>
</svg>
