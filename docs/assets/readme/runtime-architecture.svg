<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="700" viewBox="0 0 1280 700" role="img" aria-labelledby="title desc">
  <title id="title">Vbot runtime architecture</title>
  <desc id="desc">High-level runtime architecture from user input to LLM, emotion routing, StyleTTS2 speech, audio playback, and THA4 avatar animation.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#7dd3fc"/>
    </marker>
    <style>
      .bg { fill: #0b1020; }
      .title { font-family: Inter, Segoe UI, Arial, sans-serif; fill: #f8fafc; font-size: 24px; font-weight: 700; }
      .sub { font-family: Inter, Segoe UI, Arial, sans-serif; fill: #cbd5e1; font-size: 15px; }
      .node { fill: #111827; stroke: #475569; stroke-width: 1.2; rx: 12; }
      .llm { fill: #251a35; stroke: #c084fc; stroke-width: 1.4; rx: 12; }
      .voice { fill: #102820; stroke: #34d399; stroke-width: 1.4; rx: 12; }
      .avatar { fill: #2b2114; stroke: #fbbf24; stroke-width: 1.4; rx: 12; }
      .txt { font-family: Inter, Segoe UI, Arial, sans-serif; fill: #e5e7eb; font-size: 15px; font-weight: 700; }
      .small { font-family: Inter, Segoe UI, Arial, sans-serif; fill: #cbd5e1; font-size: 12px; }
      .line { fill: none; stroke: #7dd3fc; stroke-width: 2; marker-end: url(#arrow); }
    </style>
  </defs>
  <rect class="bg" width="1280" height="700"/>
  <text class="title" x="48" y="52">Vbot Runtime Architecture</text>
  <text class="sub" x="48" y="78">A multi-model desktop pipeline where text generation, voice synthesis, emotion routing, and avatar rendering stay modular.</text>

  <rect class="node" x="72" y="160" width="170" height="82"/>
  <text class="txt" x="112" y="194">User input</text>
  <text class="small" x="112" y="218">text or speech</text>

  <rect class="node" x="302" y="102" width="190" height="82"/>
  <text class="txt" x="334" y="136">Faster-Whisper</text>
  <text class="small" x="352" y="160">speech to text</text>

  <rect class="llm" x="302" y="246" width="190" height="82"/>
  <text class="txt" x="340" y="280">OllamaHandler</text>
  <text class="small" x="334" y="304">prompt + history window</text>

  <rect class="llm" x="552" y="246" width="196" height="82"/>
  <text class="txt" x="594" y="280">Shared Ollama</text>
  <text class="small" x="590" y="304">Dockerized LLM</text>

  <rect class="node" x="810" y="246" width="180" height="82"/>
  <text class="txt" x="848" y="280">Cleanup</text>
  <text class="small" x="842" y="304">remove action text</text>

  <rect class="voice" x="1050" y="128" width="180" height="92"/>
  <text class="txt" x="1090" y="162">StyleTTS2</text>
  <text class="small" x="1082" y="188">voice + style cache</text>

  <rect class="avatar" x="1050" y="338" width="180" height="92"/>
  <text class="txt" x="1092" y="372">THA4 avatar</text>
  <text class="small" x="1082" y="398">emotion + speaking</text>

  <rect class="voice" x="810" y="128" width="180" height="92"/>
  <text class="txt" x="846" y="162">Emotion</text>
  <text class="small" x="844" y="188">RoBERTa GoEmotions</text>

  <rect class="node" x="810" y="470" width="180" height="82"/>
  <text class="txt" x="856" y="504">Audio</text>
  <text class="small" x="846" y="528">non-blocking playback</text>

  <rect class="node" x="552" y="470" width="196" height="82"/>
  <text class="txt" x="600" y="504">Desktop UI</text>
  <text class="small" x="596" y="528">chat + avatar panel</text>

  <line class="line" x1="242" y1="178" x2="302" y2="143"/>
  <line class="line" x1="242" y1="218" x2="302" y2="287"/>
  <line class="line" x1="397" y1="184" x2="397" y2="246"/>
  <line class="line" x1="492" y1="287" x2="552" y2="287"/>
  <line class="line" x1="748" y1="287" x2="810" y2="287"/>
  <line class="line" x1="900" y1="246" x2="900" y2="220"/>
  <line class="line" x1="990" y1="174" x2="1050" y2="174"/>
  <path class="line" d="M 990 287 C 1030 287 1050 326 1080 338"/>
  <line class="line" x1="1140" y1="220" x2="900" y2="470"/>
  <line class="line" x1="900" y1="552" x2="748" y2="512"/>
  <line class="line" x1="1050" y1="384" x2="748" y2="512"/>
</svg>
