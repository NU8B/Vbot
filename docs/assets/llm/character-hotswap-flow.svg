<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="650" viewBox="0 0 1200 650" role="img" aria-labelledby="title desc">
  <title id="title">Vbot character hotswap flow</title>
  <desc id="desc">A decision flow for character switching. Cached character data is reused; otherwise the character stack is initialized, cached, and then applied. One Ollama Docker process remains shared.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#7dd3fc"/>
    </marker>
    <style>
      .bg { fill: #0b1120; }
      .panel { fill: #111827; stroke: #334155; stroke-width: 1.5; rx: 16; }
      .node { fill: #172033; stroke: #64748b; stroke-width: 1.2; rx: 12; }
      .decision { fill: #1f2937; stroke: #fbbf24; stroke-width: 1.4; }
      .cache { fill: #11261f; stroke: #34d399; stroke-width: 1.4; rx: 12; }
      .shared { fill: #251a35; stroke: #c084fc; stroke-width: 1.4; rx: 12; }
      .text { font-family: Inter, Segoe UI, Arial, sans-serif; fill: #e5e7eb; font-size: 18px; font-weight: 600; }
      .small { font-family: Inter, Segoe UI, Arial, sans-serif; fill: #cbd5e1; font-size: 14px; }
      .label { font-family: Inter, Segoe UI, Arial, sans-serif; fill: #bae6fd; font-size: 13px; font-weight: 600; }
      .line { fill: none; stroke: #7dd3fc; stroke-width: 2.2; marker-end: url(#arrow); }
    </style>
  </defs>
  <rect class="bg" width="1200" height="650"/>
  <text class="text" x="48" y="52">Character Hotswap Flow</text>
  <text class="small" x="48" y="78">Character state is reused or initialized at the cache layer; the Dockerized Ollama backend remains one shared process.</text>

  <rect class="panel" x="36" y="112" width="1128" height="500"/>

  <rect class="node" x="72" y="252" width="165" height="82"/>
  <text class="text" x="96" y="285">User selects</text>
  <text class="text" x="106" y="310">character</text>

  <rect class="node" x="284" y="252" width="180" height="82"/>
  <text class="text" x="314" y="285">Seamless</text>
  <text class="text" x="314" y="310">switch request</text>

  <polygon class="decision" points="610,236 720,293 610,350 500,293"/>
  <text class="text" x="556" y="288">Cached</text>
  <text class="text" x="570" y="313">data?</text>

  <rect class="cache" x="755" y="142" width="220" height="88"/>
  <text class="text" x="775" y="176">Reuse cached stack</text>
  <text class="small" x="776" y="202">TTS, avatar, handler state</text>

  <rect class="node" x="755" y="388" width="220" height="106"/>
  <text class="text" x="780" y="422">Initialize stack</text>
  <text class="small" x="776" y="450">fresh StyleTTS2 instance</text>
  <text class="small" x="776" y="472">reference style cache</text>

  <rect class="cache" x="1010" y="388" width="140" height="106"/>
  <text class="text" x="1028" y="426">Save to</text>
  <text class="text" x="1022" y="450">model_data</text>
  <text class="small" x="1028" y="476">cache it</text>

  <rect class="node" x="1010" y="242" width="140" height="92"/>
  <text class="text" x="1020" y="278">Apply switch</text>
  <text class="small" x="1020" y="304">attach TTS, UI</text>

  <line class="line" x1="237" y1="293" x2="284" y2="293"/>
  <line class="line" x1="464" y1="293" x2="500" y2="293"/>

  <path class="line" d="M 720 293 C 730 293 730 186 755 186"/>
  <text class="label" x="724" y="236">yes</text>
  <line class="line" x1="975" y1="186" x2="1010" y2="278"/>

  <path class="line" d="M 610 350 C 614 398 670 441 755 441"/>
  <text class="label" x="660" y="386">no</text>
  <line class="line" x1="975" y1="441" x2="1010" y2="441"/>
  <line class="line" x1="1080" y1="388" x2="1080" y2="334"/>

  <rect class="shared" x="270" y="510" width="465" height="76"/>
  <text class="text" x="302" y="540">Shared Ollama Docker process</text>
  <text class="small" x="302" y="562">The model runtime remains active; only character-specific</text>
  <text class="small" x="302" y="580">state changes.</text>
</svg>
