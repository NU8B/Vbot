<svg xmlns="http://www.w3.org/2000/svg" width="1260" height="650" viewBox="0 0 1260 650" role="img" aria-labelledby="title desc">
  <title id="title">THA4 SIREN morpher flow</title>
  <desc id="desc">Diagram showing how THA4 combines position grids and pose vectors, predicts grid change, alpha, and color change, then blends the final avatar frame.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#a78bfa"/>
    </marker>
    <style>
      .bg { fill: #0b1020; }
      .title { font-family: Inter, Segoe UI, Arial, sans-serif; fill: #f8fafc; font-size: 24px; font-weight: 700; }
      .sub { font-family: Inter, Segoe UI, Arial, sans-serif; fill: #cbd5e1; font-size: 15px; }
      .node { fill: #111827; stroke: #475569; stroke-width: 1.2; rx: 12; }
      .siren { fill: #291f3f; stroke: #c084fc; stroke-width: 1.4; rx: 12; }
      .out { fill: #102820; stroke: #34d399; stroke-width: 1.4; rx: 12; }
      .loss { fill: #2b2114; stroke: #fbbf24; stroke-width: 1.4; rx: 12; }
      .txt { font-family: Inter, Segoe UI, Arial, sans-serif; fill: #e5e7eb; font-size: 15px; font-weight: 700; }
      .small { font-family: Inter, Segoe UI, Arial, sans-serif; fill: #cbd5e1; font-size: 12px; }
      .code { font-family: Consolas, Menlo, monospace; fill: #ddd6fe; font-size: 12px; }
      .line { fill: none; stroke: #a78bfa; stroke-width: 2; marker-end: url(#arrow); }
      .train { fill: none; stroke: #fbbf24; stroke-width: 2; stroke-dasharray: 7 6; marker-end: url(#arrow); }
    </style>
  </defs>
  <rect class="bg" width="1260" height="650"/>
  <text class="title" x="48" y="52">THA4 SIREN Morpher Math</text>
  <text class="sub" x="48" y="78">The runtime pose vector becomes learned spatial deformation through coordinate-conditioned SIREN networks.</text>

  <rect class="node" x="58" y="132" width="170" height="92"/>
  <text class="txt" x="98" y="168">Input image</text>
  <text class="small" x="92" y="194">512 x 512 RGBA</text>

  <rect class="node" x="58" y="274" width="170" height="92"/>
  <text class="txt" x="96" y="310">Pose vector</text>
  <text class="small" x="92" y="336">face/body params</text>

  <rect class="node" x="58" y="416" width="170" height="92"/>
  <text class="txt" x="92" y="452">Position grid</text>
  <text class="small" x="88" y="478">x, y per pixel</text>

  <rect class="siren" x="308" y="244" width="230" height="154"/>
  <text class="txt" x="354" y="278">SIREN levels</text>
  <text class="code" x="342" y="306">h = sin(30 * Conv1x1(x))</text>
  <text class="small" x="342" y="334">128 -> 256 -> 512</text>
  <text class="small" x="342" y="358">pose repeated per pixel</text>

  <rect class="out" x="620" y="120" width="190" height="92"/>
  <text class="txt" x="668" y="156">grid_change</text>
  <text class="small" x="658" y="182">2-channel warp field</text>

  <rect class="out" x="620" y="274" width="190" height="92"/>
  <text class="txt" x="690" y="310">alpha</text>
  <text class="small" x="654" y="336">blend mask</text>

  <rect class="out" x="620" y="428" width="190" height="92"/>
  <text class="txt" x="656" y="464">color_change</text>
  <text class="small" x="650" y="490">generated correction</text>

  <rect class="node" x="906" y="120" width="200" height="112"/>
  <text class="txt" x="952" y="156">Warp image</text>
  <text class="code" x="936" y="184">grid = base + delta</text>
  <text class="small" x="936" y="208">bilinear grid_sample</text>

  <rect class="out" x="906" y="336" width="200" height="118"/>
  <text class="txt" x="944" y="372">Blend output</text>
  <text class="code" x="936" y="400">(1-alpha)*warped</text>
  <text class="code" x="936" y="424">+ alpha*color</text>

  <rect class="loss" x="490" y="558" width="300" height="56"/>
  <text class="txt" x="548" y="592">Distillation: L1 teacher vs student outputs</text>

  <line class="line" x1="228" y1="178" x2="308" y2="292"/>
  <line class="line" x1="228" y1="320" x2="308" y2="320"/>
  <line class="line" x1="228" y1="462" x2="308" y2="350"/>
  <line class="line" x1="538" y1="292" x2="620" y2="166"/>
  <line class="line" x1="538" y1="320" x2="620" y2="320"/>
  <line class="line" x1="538" y1="350" x2="620" y2="474"/>
  <line class="line" x1="810" y1="166" x2="906" y2="176"/>
  <path class="line" d="M 228 178 C 350 96 800 90 906 150"/>
  <line class="line" x1="1006" y1="232" x2="1006" y2="336"/>
  <path class="line" d="M 810 474 C 886 460 906 424 906 402"/>
  <line class="line" x1="810" y1="320" x2="906" y2="382"/>
  <path class="train" d="M 1006 454 C 950 560 834 586 790 586"/>
</svg>
