<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="600" viewBox="0 0 1280 600" role="img" aria-labelledby="title desc">
  <title id="title">StyleTTS2 data pipeline</title>
  <desc id="desc">A left-to-right voice-cloning data pipeline. Approved audio proceeds to export and fine-tuning; rejected or edited clips return to the quality gate on a separate lower lane.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#60a5fa"/>
    </marker>
    <marker id="loop-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#f59e0b"/>
    </marker>
    <style>
      .bg { fill: #0b1020; }
      .title { font-family: Inter, Segoe UI, Arial, sans-serif; fill: #f8fafc; font-size: 24px; font-weight: 700; }
      .sub { font-family: Inter, Segoe UI, Arial, sans-serif; fill: #cbd5e1; font-size: 15px; }
      .node { fill: #121b2f; stroke: #475569; stroke-width: 1.2; rx: 12; }
      .gate { fill: #1f2937; stroke: #fbbf24; stroke-width: 1.4; rx: 12; }
      .human { fill: #102820; stroke: #34d399; stroke-width: 1.4; rx: 12; }
      .train { fill: #291f3f; stroke: #c084fc; stroke-width: 1.4; rx: 12; }
      .txt { font-family: Inter, Segoe UI, Arial, sans-serif; fill: #e5e7eb; font-size: 14px; font-weight: 600; }
      .small { font-family: Inter, Segoe UI, Arial, sans-serif; fill: #cbd5e1; font-size: 12px; }
      .label { font-family: Inter, Segoe UI, Arial, sans-serif; fill: #bae6fd; font-size: 12px; font-weight: 600; }
      .loop-label { font-family: Inter, Segoe UI, Arial, sans-serif; fill: #fcd34d; font-size: 12px; font-weight: 600; }
      .line { fill: none; stroke: #60a5fa; stroke-width: 2; marker-end: url(#arrow); }
      .loop { fill: none; stroke: #f59e0b; stroke-width: 2; stroke-dasharray: 7 6; marker-end: url(#loop-arrow); }
    </style>
  </defs>
  <rect class="bg" width="1280" height="600"/>
  <text class="title" x="48" y="52">Automated StyleTTS2 Voice-Cloning Pipeline</text>
  <text class="sub" x="48" y="78">Automated segmentation and metrics narrow the data; human review protects quality before training export.</text>

  <rect class="node" x="52" y="150" width="132" height="78"/>
  <text class="txt" x="78" y="181">Source audio</text>
  <text class="small" x="80" y="204">public clips</text>
  <rect class="node" x="220" y="150" width="132" height="78"/>
  <text class="txt" x="250" y="181">Cleanup</text>
  <text class="small" x="244" y="204">ffmpeg/vocals</text>
  <rect class="node" x="388" y="150" width="132" height="78"/>
  <text class="txt" x="420" y="181">Chunking</text>
  <text class="small" x="412" y="204">1.0-7.5 sec</text>
  <rect class="node" x="556" y="150" width="132" height="78"/>
  <text class="txt" x="586" y="181">Whisper</text>
  <text class="small" x="592" y="204">transcripts</text>
  <rect class="gate" x="724" y="128" width="150" height="122"/>
  <text class="txt" x="760" y="164">Quality gate</text>
  <text class="small" x="752" y="190">STOI, PESQ</text>
  <text class="small" x="752" y="212">spectral metrics</text>
  <text class="small" x="752" y="234">VAD checks</text>
  <rect class="human" x="918" y="128" width="150" height="122"/>
  <text class="txt" x="952" y="164">Human review</text>
  <text class="small" x="948" y="190">approve/reject</text>
  <text class="small" x="948" y="212">edit transcript</text>
  <text class="small" x="948" y="234">save metadata</text>
  <rect class="train" x="1112" y="128" width="126" height="122"/>
  <text class="txt" x="1142" y="164">Export</text>
  <text class="small" x="1132" y="190">normalize text</text>
  <text class="small" x="1132" y="212">phonemize</text>
  <text class="small" x="1132" y="234">train/val split</text>

  <line class="line" x1="184" y1="189" x2="220" y2="189"/>
  <line class="line" x1="352" y1="189" x2="388" y2="189"/>
  <line class="line" x1="520" y1="189" x2="556" y2="189"/>
  <line class="line" x1="688" y1="189" x2="724" y2="189"/>
  <line class="line" x1="874" y1="189" x2="918" y2="189"/>
  <text class="label" x="880" y="174">passes</text>
  <line class="line" x1="1068" y1="189" x2="1112" y2="189"/>
  <text class="label" x="1072" y="174">approved</text>

  <!-- The rejection loop is separated below the main path, so its return direction is unambiguous. -->
  <path class="loop" d="M 993 250 L 993 306 L 799 306 L 799 250"/>
  <text class="loop-label" x="816" y="292">reject or edit → re-check</text>

  <rect class="train" x="438" y="410" width="404" height="92"/>
  <text class="txt" x="522" y="446">Fine-tuned StyleTTS2 voices</text>
  <text class="small" x="520" y="472">character-specific checkpoints</text>
  <text class="small" x="538" y="490">and emotion reference styles</text>
  <path class="line" d="M 1175 250 L 1175 456 L 842 456"/>
  <text class="label" x="1002" y="442">training output</text>
</svg>
